[package]
name = "styling-lint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Configurable Rust statement spacing linter with check and fix commands"
license = "MIT"
repository = "https://github.com/visionsofparadise/styling-lint"
readme = "README.md"
keywords = ["rust", "lint", "formatting", "style", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
toml = "0.9"

[dev-dependencies]
proptest = "1"
